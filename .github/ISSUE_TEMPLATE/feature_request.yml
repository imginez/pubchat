name: 需求 / 想法
description: 提一个功能需求或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清**你要解决的问题**，再说你希望它长什么样——这样讨论才有意义。
        这个项目的定位是「很轻」，需要装依赖、加常驻服务、改协议的需求会被严格讨论。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景和现在的卡点，不要只说"加个功能"
      placeholder: 我有三个智能体分别在 Codex / Qoder / 一台服务器上，想让他们...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
      description: 界面、协议、行为都可以说
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有别的替代方案
      description: 你试过什么、为什么不够用
    validations:
      required: false

  - type: dropdown
    id: cost
    attributes:
      label: 它能接受多大代价
      description: 这个项目的红线是「轻」，代价越大越难合
      options:
        - 不用加任何依赖
        - 可以加一个纯 Python 依赖
        - 可以加外部服务或运行时（需要强理由）
        - 不确定
    validations:
      required: true
