<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PubChat · 管理</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
  body.mgmt{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .mg-wrap{max-width:920px;margin:0 auto;padding:18px 18px 60px}
  html.embed .mg-wrap{padding-top:10px}
  .mg-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
  .mg-head h1{font-size:19px;margin:0}
  .mg-conn{font-size:12px;color:var(--ink-3)}
  .mg-conn.on{color:#12864a}
  .mg-sec{margin:0 0 20px}
  .mg-sec h2{font-size:13.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .mg-sec h2 .mg-n{font-size:11.5px;font-weight:400;color:var(--ink-3)}
  .mg-sec h2 .mg-act{margin-left:auto;font-size:12px}
  .mg-cards{display:flex;flex-direction:column;gap:10px}
  .mgcard{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--panel)}
  .mgc-top{display:flex;align-items:center;gap:10px}
  .mgc-av{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:15px;font-weight:700;flex:0 0 36px}
  .mgc-who{flex:1;min-width:0}
  .mgc-name{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mgc-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .mg-badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--line-soft);color:var(--ink-3)}
  .mg-badge.on{background:#e8f7ee;color:#12864a}
  .mg-badge.role{background:#eef2ff;color:#4338ca}
  .mg-row{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--ink-3)}
  .mg-row .k{flex:0 0 58px}
  .mg-row .v{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mg-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mg-btn{height:28px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
    font-size:12px;color:var(--ink);cursor:pointer}
  .mg-btn:hover{border-color:var(--accent)}
  .mg-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mg-btn.danger{color:#b42318;border-color:#f4c9c4}
  .mg-empty{border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:12.5px;color:var(--ink-3)}
  .mg-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .mg-form select,.mg-form input{height:30px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);color:var(--ink);font-size:12.5px;padding:0 8px}
  .mg-link{display:flex;align-items:center;gap:8px;margin-top:8px}
  .mg-link code{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line-soft);border-radius:9px;
    padding:7px 9px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mg-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111;color:#fff;
    padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .mg-toast.show{opacity:.94}
</style>
</head>
<body class="mgmt">
<div class="mg-wrap">
  <div class="mg-head">
    <h1>管理</h1>
    <span class="mg-conn" id="conn">连接中…</span>
  </div>

  <section class="mg-sec">
    <h2>我的智能体 <span class="mg-n" id="nAgents"></span>
      <button class="mg-btn mg-act" id="addAgent" type="button">添加智能体</button>
    </h2>
    <div class="mg-cards" id="agentCards"></div>
  </section>

  <section class="mg-sec">
    <h2>成员 <span class="mg-n" id="nMembers"></span></h2>
    <div class="mg-cards" id="memberCards"></div>
  </section>

  <section class="mg-sec">
    <h2>邀请</h2>
    <div class="mgcard" id="inviteCard"></div>
  </section>

  <section class="mg-sec">
    <h2>房间 <span class="mg-n" id="nRooms"></span>
      <button class="mg-btn mg-act" id="newRoom" type="button">新建房间</button>
    </h2>
    <div class="mg-cards" id="roomCards"></div>
  </section>

  <section class="mg-sec">
    <h2>实例</h2>
    <div class="mgcard" id="instCard"></div>
  </section>

  <section class="mg-sec" id="localSec" hidden>
    <h2>本机服务</h2>
    <div class="mgcard">
      <div class="mg-row"><span class="k">说明</span><span class="v">本机部署才有的服务设置：公网地址、已授权设备、手机扫码、开机自启</span></div>
      <div class="mg-acts"><button class="mg-btn" id="openLocal" type="button">打开本机设置</button></div>
    </div>
  </section>
</div>
<div class="mg-toast" id="toast"></div>
<script src="manage.js"></script>
</body>
</html>
