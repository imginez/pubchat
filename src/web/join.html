<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PubChat · 加入</title>
<style>
  :root{--ink:#1d2129;--muted:#86909c;--line:#e5e6eb;--bg:#f5f6f8;--brand:#2f6bff;--ok:#00a870;--err:#d93026}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;max-width:420px;width:90%;box-shadow:0 8px 30px rgba(20,30,60,.08)}
  h1{font-size:20px;margin:0 0 4px}
  .inst{color:var(--muted);font-size:13px;margin-bottom:16px}
  .fp{font-family:ui-monospace,Consolas,monospace;color:var(--brand);font-weight:600}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;outline:none;background:#fff;margin-bottom:10px}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,107,255,.1)}
  .btn{width:100%;padding:11px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer;font-size:15px}
  .btn[disabled]{opacity:.5;cursor:default}
  .err{color:var(--err);font-size:13px;margin-top:8px;min-height:18px}
  .ok{color:var(--ok);font-size:13px;margin-top:8px}
  .muted{color:var(--muted);font-size:12px;margin-top:12px}
  .creds{margin-top:16px;padding:12px;background:#f7f8fa;border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:13px;display:none}
  .creds.show{display:block}
  .creds b{color:var(--ink)}
  .step{display:none}
  .step.active{display:block}
</style>
</head>
<body>
<div class="card">
  <h1>加入 PubChat</h1>
  <div class="inst" id="instInfo">正在连接实例…</div>

  <div class="step active" id="stepForm">
    <div id="tokenHint" class="muted" style="margin-bottom:10px"></div>
    <input id="nameInput" placeholder="你的显示名" maxlength="20" autocomplete="name">
    <input id="cidInput" placeholder="登录名（小写字母/数字/下划线，2-32位）" maxlength="32" autocomplete="username">
    <button class="btn" id="joinBtn" type="button" disabled>加入</button>
    <div class="err" id="errMsg"></div>
  </div>

  <div class="step" id="stepLoading">
    <div class="muted">正在加入…</div>
  </div>

  <div class="step" id="stepDone">
    <div class="ok" id="doneMsg">加入成功！</div>
    <div class="creds" id="credsBox">
      <div>登录名：<b id="credCid"></b></div>
      <div>一级 Key：<b id="credKey"></b></div>
    </div>
    <div class="muted">请妥善保存你的 Key，它是登录密码。</div>
    <button class="btn" id="goChatBtn" type="button" style="margin-top:12px">进入聊天</button>
  </div>

  <div class="step" id="stepPending">
    <div class="ok">已提交，等待房主批准</div>
    <div class="muted" id="pendingMsg">房主批准后即可用你填的登录名和 Key 登录。</div>
  </div>
</div>

<script>
(function () {
  var token = '';
  var instData = null;
  var joinedUser = null;

  function $(id) { return document.getElementById(id); }
  function showStep(id) {
    document.querySelectorAll('.step').forEach(function (el) { el.classList.remove('active'); });
    $(id).classList.add('active');
  }

  function wsUrl() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return proto + '//' + location.host + '/ws';
  }

  fetch('/api/instance').then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || '获取实例信息失败');
    instData = j;
    $('instInfo').innerHTML = '实例：<span class="fp">' + esc(j.name) + '</span> · #' + esc(j.fingerprint);
    token = (location.hash || '').match(/[#?&]t=([^&]+)/);
    token = token ? token[1] : '';
    if (!token) {
      $('tokenHint').textContent = '没有邀请码，请通过邀请链接进入。';
      $('joinBtn').disabled = true;
    } else {
      $('tokenHint').textContent = '已读取到邀请码，填写信息后点加入。';
      checkReady();
    }
  }).catch(function (e) {
    $('instInfo').textContent = '连接失败：' + e.message;
  });

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function checkReady() {
    var name = $('nameInput').value.trim();
    var cid = $('cidInput').value.trim();
    $('joinBtn').disabled = !(name && cid && token);
  }

  $('nameInput').addEventListener('input', checkReady);
  $('cidInput').addEventListener('input', checkReady);

  $('joinBtn').addEventListener('click', function () {
    var name = $('nameInput').value.trim();
    var cid = $('cidInput').value.trim().toLowerCase();
    $('errMsg').textContent = '';
    showStep('stepLoading');

    var ws = new WebSocket(wsUrl());
    var timeout = setTimeout(function () {
      try { ws.close(); } catch (e) {}
      showStep('stepForm');
      $('errMsg').textContent = '连接超时，请重试。';
    }, 15000);

    ws.onopen = function () {
      ws.send(JSON.stringify({
        type: 'join',
        token: token,
        name: name,
        client_id: cid
      }));
    };

    ws.onmessage = function (ev) {
      clearTimeout(timeout);
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === 'joined' && msg.ok) {
        joinedUser = msg;
        $('credCid').textContent = msg.client_id;
        $('credKey').textContent = msg.key1;
        $('credsBox').classList.add('show');
        showStep('stepDone');
        try { ws.close(); } catch (e) {}
      } else if (msg.type === 'pending' && msg.ok) {
        $('pendingMsg').textContent = (msg.message || '已提交，等待房主批准') +
          '（登录名：' + (msg.client_id || '') + '）';
        showStep('stepPending');
        try { ws.close(); } catch (e) {}
      } else if (msg.type === 'error') {
        showStep('stepForm');
        $('errMsg').textContent = msg.message || '加入失败';
        try { ws.close(); } catch (e) {}
      }
    };

    ws.onerror = function () {
      clearTimeout(timeout);
      showStep('stepForm');
      $('errMsg').textContent = '连接失败，请检查网络后重试。';
    };

    ws.onclose = function () {
      clearTimeout(timeout);
    };
  });

  $('goChatBtn').addEventListener('click', function () {
    if (!joinedUser) return;
    var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
    if (mobile) {
      // 手机端主入口是新客户端 /app/：先把登录态写成本地会话，再跳过去
      try {
        localStorage.setItem('pubchat.session', JSON.stringify({
          type: 'object',
          data: {
            server: location.origin,
            user: joinedUser.client_id,
            key: joinedUser.key1,
            name: joinedUser.name || joinedUser.client_id
          }
        }));
      } catch (e) {}
      location.href = location.origin + '/app/';
      return;
    }
    var base = location.origin + '/';
    location.href = base + '#u=' + encodeURIComponent(joinedUser.client_id) +
                    '&k=' + encodeURIComponent(joinedUser.key1);
  });
})();
</script>
</body>
</html>
